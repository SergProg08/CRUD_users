[project]
name = "crud-users"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SergProg08", email = "rybakvasilii1608@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.143.0",
    "loguru>=0.7.3",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.14.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
